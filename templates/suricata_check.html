{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/suricata_check.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1>Suricata 规则检查舱</h1>

    <form class="layui-form" action="" method="post">
    <div class="workspace-grid">
        <div class="panel-card assets-panel">
            <div class="panel-title">测试资产配备</div>

            <div class="layui-form-item">
                <label for="file_select" class="layui-form-label">1. 挂载 .rules 文件</label>
                <div class="layui-input-block">
                    <select name="file_select" id="file_select" lay-filter="file_select">
                        <option value="">-- 请选择规则库 --</option>
                        {% for file in rule_files %}
                        <option value="{{ file }}">{{ file }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label for="pcap_select" class="layui-form-label">2. 注入 .pcap 流量包</label>
                <div class="layui-input-block">
                    <select name="pcap_select" id="pcap_select">
                        <option value="">-- 请选择流量样本 --</option>
                        {% for pcap_file in pcap_files %}
                        <option value="{{ pcap_file }}">{{ pcap_file }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="action-group">
                <button type="submit" id="execute_btn" name="execute" class="layui-btn btn-execute">执行 Suricata 检查</button>
                <button type="submit" name="detect" class="layui-btn btn-detect">运行 Detect 检查</button>
            </div>
        </div>

        <div class="panel-card rules-panel">
            <div class="panel-title">
                <span>规则视界</span>
                <span class="hint">拖拽 .pcap / .rules 至下方区域上传</span>
            </div>

            <div class="layui-form-item">
                <label for="file_content_display" class="layui-form-label">原始规则内容</label>
                <textarea id="file_content_display" class="code-textarea" readonly placeholder="选中左侧文件以加载内容，或将文件拖拽至此区域...">{{ file_content }}</textarea>
            </div>

            <div class="layui-form-item" style="margin-top: 24px;">
                <label for="file_content_edit" class="layui-form-label">编辑重载区域</label>
                <textarea name="file_content_edit" id="file_content_edit" class="code-textarea" placeholder="在此处键入或修改规则，需包含 metadata:service 以通过合规检查..."></textarea>

                <div class="rules-toolbar">
                    <button type="submit" id="load_rules_btn" name="load_rules" class="layui-btn layui-btn-normal layui-btn-sm">重载修改后的规则</button>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/rule_autocomplete.js') }}"></script>
<script>
layui.use(['form', 'layer'], function () {
    var form = layui.form;
    var layer = layui.layer;

    var fileContentDisplay = document.getElementById('file_content_display');
    var fileContentEdit = document.getElementById('file_content_edit');
    var loadRulesBtn = document.getElementById('load_rules_btn');

    loadRulesBtn.style.display = 'none';

    function checkContentCompliance() {
        var content = fileContentEdit.value.trim();
        if (content.includes('metadata:service')) {
            loadRulesBtn.style.display = 'inline-block';
        } else {
            loadRulesBtn.style.display = 'none';
        }
    }

    initRuleAutocomplete('file_content_edit', checkContentCompliance, { layer: layer });
    fileContentEdit.addEventListener('input', checkContentCompliance);

    form.on('select(file_select)', function (data) {
        var selectedFile = data.value;
        if (!selectedFile) {
            fileContentDisplay.value = '';
            return;
        }
        fetch('{{ url_for("suricata_check.load_rules_content") }}?file=' + encodeURIComponent(selectedFile))
            .then(function(r) {
                if (!r.ok) throw new Error('加载失败');
                return r.text();
            })
            .then(function(content) {
                fileContentDisplay.value = content;
                layer.msg('规则加载成功');
            })
            .catch(function() {
                fileContentDisplay.value = '加载失败';
                layer.msg('规则加载失败');
            });
    });

    var textArea = fileContentDisplay;
    textArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        textArea.classList.add('dragover');
    });
    textArea.addEventListener('dragleave', function() {
        textArea.classList.remove('dragover');
    });
    textArea.addEventListener('drop', function(e) {
        e.preventDefault();
        textArea.classList.remove('dragover');
        var files = e.dataTransfer.files;
        if (!files.length) return;
        var file = files[0];
        if (!/\.(pcap|pcapng|rules)$/i.test(file.name)) {
            layer.msg('仅支持 .pcap/.pcapng/.rules');
            return;
        }
        var formData = new FormData();
        formData.append('file', file);
        fetch('{{ url_for("suricata_check.upload_pcap") }}', { method: 'POST', body: formData })
            .then(function() {
                layer.msg('上传成功');
                location.reload();
            })
            .catch(function() {
                layer.msg('上传失败');
            });
    });
});
</script>
{% include 'footer.html' %}
{% endblock %}
