{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1 class="page-title">Detect 规则检查结果</h1>
        <a href="{{ url_for('detect_check.check') }}" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            返回
        </a>
    </div>

    <div class="result-card">
        <div class="result-toolbar">
            <span class="result-label">检测输出</span>
            <span class="result-meta">{{ pcap_name }}</span>
        </div>

        <textarea readonly>{{ output }}</textarea>
        <div id="content" style="display:none;"></div>

        <div class="action-bar">
            <button class="btn" onclick="captureAndDownload('{{ pcap_name }}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载截图
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/html2canvas.min.js') }}"></script>
<script>
function captureAndDownload(pcapName) {
    var textArea = document.querySelector('textarea');
    var contentDiv = document.getElementById('content');
    contentDiv.textContent = textArea.value;
    contentDiv.style.display = 'block';
    textArea.style.height = 'auto';
    textArea.style.height = textArea.scrollHeight + 'px';

    if (!textArea.value.startsWith('{"timestamp')) {
        console.error('Error: textarea 内容不符合预期格式');
        return;
    }

    html2canvas(contentDiv, {scrollY: -window.scrollY}).then(function(canvas) {
        contentDiv.style.display = 'none';
        var image = canvas.toDataURL('image/png');
        var link = document.createElement('a');
        link.download = pcapName + '.png';
        link.href = image;
        link.click();
        setTimeout(function() {
            window.location.href = "{{ url_for('detect_check.check') }}";
        }, 600);
    }).catch(function(err) {
        console.error('Error capturing the content:', err);
    });
}

window.onload = function() {
    captureAndDownload('{{ pcap_name }}');
};
</script>
{% include 'footer.html' %}
{% endblock %}
