{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/generate_pcap.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
{% endblock %}

{% block content %}
    <fieldset class="layui-elem-field generate-pcap-title">
        <legend>生成PCAP文件</legend>
    </fieldset>

    <form class="layui-form" action="{{ url_for('generate_pcap.generate') }}" method="post">
        <div class="textareas-container">
            <div class="workspace-card">
                <div class="card-header">
                    <label for="request_body">请求体 (Request)</label>
                    <div class="layui-btn-group">
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="标准GET" data-type="request">标准GET</button>
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="普通POST" data-type="request">普通POST</button>
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="FORM提交" data-type="request">FORM提交</button>
                    </div>
                </div>
                <textarea name="request_body" class="layui-textarea" placeholder="双击页面空白处可清空内容...">{{ request_body_content }}</textarea>
            </div>

            <div class="workspace-card">
                <div class="card-header">
                    <label for="response_body">响应体 (Response)</label>
                    <div class="layui-btn-group">
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="模板200" data-type="response">200 OK</button>
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="模板302" data-type="response">302 Found</button>
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="模板404" data-type="response">404 Not Found</button>
                        <button type="button" class="layui-btn layui-btn-primary template-btn" data-template="模板502" data-type="response">502 Bad Gateway</button>
                    </div>
                </div>
                <textarea name="response_body" class="layui-textarea" placeholder="双击页面空白处可清空内容...">{{ template_response }}</textarea>
            </div>
        </div>

        <div class="bottom-action-zone">
            <label for="file_name">请为生成的 PCAP 命名</label>
            <div class="action-input-group">
                <input type="text" name="file_name" class="layui-input" placeholder="输入文件名" autocomplete="off">
                <button type="submit" name="generate" class="layui-btn layui-btn-warm generate-btn">生 成</button>
            </div>
        </div>
    </form>

    {% include 'footer.html' %}
{% endblock %}

{% block extra_js %}
<script>
layui.use(['form', 'layer'], function () {
    var form = layui.form,
        layer = layui.layer;

    // ────────────────────────────────────────────────────────────────
    // 同步两个 textarea 的高度
    // ────────────────────────────────────────────────────────────────
    var requestTextarea = document.querySelector('textarea[name="request_body"]');
    var responseTextarea = document.querySelector('textarea[name="response_body"]');

    function syncTextareaHeights(source) {
        var target = source === requestTextarea ? responseTextarea : requestTextarea;
        if (source && target) {
            // 限制在 max-height (520px) 范围内同步
            var h = Math.min(source.offsetHeight, 520);
            target.style.height = h + 'px';
        }
    }

    if (requestTextarea && responseTextarea) {
        requestTextarea.addEventListener('input', function() { syncTextareaHeights(requestTextarea); });
        responseTextarea.addEventListener('input', function() { syncTextareaHeights(responseTextarea); });

        // 同步初始高度（如果内容已预填）
        if (requestTextarea.value || responseTextarea.value) {
            syncTextareaHeights(requestTextarea);
        }
    }

    // ────────────────────────────────────────────────────────────────
    // 模板填充
    // ────────────────────────────────────────────────────────────────
    document.querySelectorAll('.template-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const templateName = this.getAttribute('data-template');
            const templateType = this.getAttribute('data-type');
            fetch(`/generate_pcap/template?name=${templateName}&type=${templateType}`)
                .then(response => response.text())
                .then(text => {
                    if (templateType === 'request') {
                        requestTextarea.value = text;
                        syncTextareaHeights(requestTextarea);
                    } else if (templateType === 'response') {
                        responseTextarea.value = text;
                        syncTextareaHeights(responseTextarea);
                    }
                })
                .catch(error => {
                    layer.alert('获取模板内容失败: ' + error.message);
                });
        });
    });

    // ────────────────────────────────────────────────────────────────
    // 双击清空
    // ────────────────────────────────────────────────────────────────
    document.body.addEventListener('dblclick', function(event) {
        if (event.target.classList.contains('layui-textarea') ||
            event.target.classList.contains('layui-btn') ||
            event.target.classList.contains('layui-input')) {
            return;
        }

        document.querySelectorAll('textarea, input').forEach(inputElement => {
            if (inputElement.type !== 'submit' && inputElement.type !== 'button') {
                inputElement.value = '';
            }
        });

        layer.msg('所有字段已被清空', {
            time: 1200,
            icon: 1,
            offset: 't',
        });
    });

    // ────────────────────────────────────────────────────────────────
    // HTTP 请求体自动修正
    // ────────────────────────────────────────────────────────────────
    if (requestTextarea) {
        requestTextarea.addEventListener('blur', function () {
            let content = requestTextarea.value;
            let lines = content.split('\n');

            if (lines.length > 0 && lines[0].trim() !== '') {
                let firstLine = lines[0];
                let modified = false;

                const regex = /^([A-Z]{3,6})\s(\/?.*)/;
                let match = firstLine.match(regex);

                if (match) {
                    let capitalLetters = match[1];
                    let restOfLine = match[2];

                    if (!restOfLine.startsWith('/')) {
                        restOfLine = '/' + restOfLine;
                        modified = true;
                    }

                    firstLine = `${capitalLetters} ${restOfLine}`;
                }

                const httpSuffixRegex = /HTTP\/1\.1\s*$/;
                if (httpSuffixRegex.test(firstLine)) {
                    const trimmed = firstLine.replace(/\s+$/, '');
                    if (trimmed !== firstLine) {
                        firstLine = trimmed;
                        modified = true;
                    }
                } else {
                    if (firstLine.endsWith(' ')) {
                        firstLine += 'HTTP/1.1';
                    } else {
                        firstLine += ' HTTP/1.1';
                    }
                    modified = true;
                }

                if (modified) {
                    lines[0] = firstLine;
                    requestTextarea.value = lines.join('\n');

                    layer.msg('请求体内容已自动修正', {
                        time: 1500,
                        icon: 1,
                        offset: 't',
                    });
                }
            }
        });
    }

    const fileNameInput = document.querySelector('input[name="file_name"]');
    const formEl = document.querySelector('form.layui-form');
    if (formEl && fileNameInput) {
        formEl.addEventListener('submit', function () {
            fileNameInput.value = fileNameInput.value.trim();
        });
    }
});
</script>
{% endblock %}
