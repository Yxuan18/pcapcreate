{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="greeting-section layui-anim layui-anim-upbit">
        <h1>{{ title }}</h1>
        <p class="greeting-subtitle">选择一个工具开始探索</p>
    </div>

    <div class="layui-row layui-col-space20">
        {% if items %}
            {% for item, link in items %}
            <div class="layui-col-xs6 layui-col-sm4 layui-col-md3">
                <a href="{{ link }}" class="nav-card layui-anim layui-anim-fadein">
                    <span class="nav-card-title">{{ item }}</span>
                </a>
            </div>
            {% endfor %}
        {% else %}
            <div class="layui-col-md12">
                <div class="empty-state layui-anim layui-anim-fadein">
                    <i class="layui-icon layui-icon-face-smile"></i>
                    <p>这里暂时空空如也，等会儿再来看看吧~</p>
                </div>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
