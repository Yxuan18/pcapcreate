{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/intermediate.css') }}">
{% endblock %}

{% block content %}
<div class="container intermediate-container">
    <div class="card">
        <div class="pulse-ring">
            <div class="pulse-dot"></div>
        </div>
        <h1>{{ message }}</h1>
        <p class="status" id="fileCount">文件数量: 正在检查...</p>
        <button id="retryButton" class="retry-btn" onclick="submitForm()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
            重新执行
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function submitForm() {
    var form = document.createElement("form");
    form.method = "POST";
    form.action = "{{ url_for('detect_check.run_detect') }}";

    var ruleInput = document.createElement("input");
    ruleInput.type = "hidden";
    ruleInput.name = "rule_path";
    ruleInput.value = {{ rule_path | tojson }};
    form.appendChild(ruleInput);

    var pcapInput = document.createElement("input");
    pcapInput.type = "hidden";
    pcapInput.name = "pcap_path";
    pcapInput.value = {{ pcap_path | tojson }};
    form.appendChild(pcapInput);

    document.body.appendChild(form);
    form.submit();

    document.getElementById('retryButton').classList.remove('visible');
    setTimeout(checkFiles, 100);
}

function checkFiles() {
    fetch('{{ url_for("detect_check.check_files") }}')
        .then(function(response) { return response.json(); })
        .then(function(data) {
            document.getElementById('fileCount').textContent = '文件数量: ' + data.count;
            if (data.count >= 1) {
                document.getElementById('retryButton').classList.add('visible');
            }
        })
        .catch(function(error) { console.error('Fetch error:', error); });
}

window.onload = function() {
    submitForm();
};
</script>
{% include 'footer.html' %}
{% endblock %}
